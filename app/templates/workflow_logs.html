{% extends "base.html" %}

{% block title %}工作流日志 - GitHub Actions Manager{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2>工作流执行日志</h2>
                <p class="text-muted mb-0">
                    仓库: <strong>{{ repo }}</strong>
                    | 执行记录 ID: <strong>{{ run_id }}</strong>
                </p>
            </div>
            <div>
                <button class="btn btn-outline-secondary" onclick="loadLogs()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
                <a href="/workflows/runs?repo={{ repo }}" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left"></i> 返回执行记录
                </a>
            </div>
        </div>

        <!-- 日志内容 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">日志输出</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="copyLogs()">
                    <i class="bi bi-clipboard"></i> 复制日志
                </button>
            </div>
            <div class="card-body">
                <pre id="logsContent" class="bg-dark text-light p-3 rounded" style="max-height: 600px; overflow-y: auto; font-size: 12px;">加载中...</pre>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const repo = "{{ repo }}";
const runId = {{ run_id }};

$(document).ready(function() {
    loadLogs();
});

function loadLogs() {
    const logsDiv = $('#logsContent');
    logsDiv.text('加载中...');

    $.ajax({
        url: '/workflows/api/logs',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            repo: repo,
            run_id: runId
        }),
        success: function(data) {
            if (data.success) {
                // 处理日志内容
                const logs = data.logs || '暂无日志';
                logsDiv.text(logs);
            } else {
                logsDiv.text(`加载日志失败: ${data.error}`);
                showAlert(`加载日志失败: ${data.error}`, 'danger');
            }
        },
        error: function(xhr) {
            const msg = xhr.responseJSON?.error || '加载日志失败';
            logsDiv.text(msg);
            showAlert(msg, 'danger');
        }
    });
}

function copyLogs() {
    const logsText = $('#logsContent').text();

    if (!logsText || logsText === '加载中...') {
        showAlert('没有可复制的日志', 'warning');
        return;
    }

    // 使用 Clipboard API
    navigator.clipboard.writeText(logsText).then(() => {
        showAlert('日志已复制到剪贴板', 'success');
    }).catch(err => {
        // 降级方案
        const textarea = document.createElement('textarea');
        textarea.value = logsText;
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showAlert('日志已复制到剪贴板', 'success');
        } catch (e) {
            showAlert('复制失败', 'danger');
        }
        document.body.removeChild(textarea);
    });
}

function showAlert(message, type) {
    const alert = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    $('#alert-container').html(alert);
    setTimeout(() => {
        $('.alert').alert('close');
    }, 3000);
}
</script>
{% endblock %}
